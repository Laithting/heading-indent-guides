# 推送版本號 tag（例如 1.0.1）時，自動建立 GitHub Release 並附上來源證明（artifact attestation）。
# tag 必須跟 manifest.json 的 version 一樣，前面不加 v。
name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write      # 建立 release
  id-token: write      # 產生來源證明
  attestations: write  # 上傳來源證明

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json version ($version) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Attest release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
